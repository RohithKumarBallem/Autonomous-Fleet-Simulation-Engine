# One Indexed Job = one validation run. Kubernetes gives every pod a distinct
# JOB_COMPLETION_INDEX (0..completions-1); `fleetctl run --shard-from-env` turns that into the
# shard it owns, so no coordinator is needed. Shard files are written atomically, which makes a
# retried pod idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-validate
  namespace: fleet
  labels:
    app.kubernetes.io/name: fleet-sim
spec:
  completions: 4   # must equal FLEET_SHARDS below; scripts/k8s_run_suite.sh keeps them in sync
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-sim
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shard
          image: fleet-sim:latest
          imagePullPolicy: IfNotPresent
          args:
            - --threads
            - "2"
            - run
            - --scenarios
            - /data/suite/scenarios.ndjson
            - --out-dir
            - /data/suite/results
            - --shard-from-env
          env:
            - name: FLEET_SHARDS
              value: "4"
          resources:
            requests:
              cpu: "1"
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fleet-data
